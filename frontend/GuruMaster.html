<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GuruMaster — Carga Colombia</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
window.addEventListener('load', function() {
  var ok = window.React && window.ReactDOM && window.Babel;
  if (!ok) {
    document.getElementById('root').innerHTML =
      '<div style="padding:24px;font-family:sans-serif;font-size:13px;line-height:1.8">' +
      '<b style="color:#DC2626;font-size:16px">Error al cargar scripts CDN</b><br><br>' +
      'React: <b>' + (window.React ? '✓ OK' : '✗ NO') + '</b><br>' +
      'ReactDOM: <b>' + (window.ReactDOM ? '✓ OK' : '✗ NO') + '</b><br>' +
      'Babel: <b>' + (window.Babel ? '✓ OK' : '✗ NO') + '</b><br>' +
      'Lucide: <b>' + (window.lucide ? '✓ OK' : '✗ NO') + '</b><br><br>' +
      '<span style="color:#555">Verifica tu conexión a internet y recarga con Ctrl+Shift+R</span>' +
      '</div>';
  }
});
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --base:        #F5F6F8;
  --surface:     #FFFFFF;
  --raised:      #F0F2F5;
  --border:      #E2E6EC;
  --border-plus: #CBD2DA;
  --teal:        #0D7F6E;
  --teal-mid:    #1A9B87;
  --teal-bg:     #EBF7F5;
  --teal-border: #A7D9D2;
  --teal-text:   #0A6558;
  --ink-1:       #111827;
  --ink-2:       #4B5563;
  --ink-3:       #9CA3AF;
  --success:     #0D7F6E;
  --success-bg:  #EBF7F5;
  --warn:        #D97706;
  --warn-bg:     #FEF3C7;
  --danger:      #DC2626;
  --danger-bg:   #FEE2E2;
  --info:        #2563EB;
  --info-bg:     #DBEAFE;
  --shadow-sm:   0 1px 3px rgba(17,24,39,.06);
  --shadow-md:   0 4px 16px rgba(17,24,39,.08);
  --shadow-lg:   0 8px 32px rgba(17,24,39,.12);
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;
  --font: 'Inter', -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}

[data-theme="dark"] {
  --base:        #0F1117;
  --surface:     #161B26;
  --raised:      #1E2533;
  --border:      #2A3348;
  --border-plus: #3A4560;
  --teal:        #1DB897;
  --teal-mid:    #25D4AF;
  --teal-bg:     rgba(29,184,151,.12);
  --teal-border: rgba(29,184,151,.3);
  --teal-text:   #4ECFB5;
  --ink-1:       #E8EDF5;
  --ink-2:       #8B95A8;
  --ink-3:       #4A5568;
  --success:     #1DB897;
  --success-bg:  rgba(29,184,151,.12);
  --warn:        #F59E0B;
  --warn-bg:     rgba(245,158,11,.12);
  --danger:      #F87171;
  --danger-bg:   rgba(248,113,113,.12);
  --info:        #60A5FA;
  --info-bg:     rgba(96,165,250,.12);
  --shadow-sm:   0 1px 3px rgba(0,0,0,.25);
  --shadow-md:   0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:   0 8px 40px rgba(0,0,0,.5);
}

html, body, #root { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--base); color: var(--ink-1); -webkit-font-smoothing: antialiased; }
button { cursor: pointer; font-family: var(--font); }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-plus); border-radius: 3px; }

@keyframes pulse-live { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }
@keyframes slide-up   { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes dot-blink  { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }

.anim-up { animation: slide-up .22s ease both; }
.dot { width:5px; height:5px; border-radius:50%; background:var(--teal); animation:dot-blink 1.4s infinite ease-in-out; }
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}

/* Layout */
.app-shell { display:grid; grid-template-rows:52px 1fr; height:100vh; }
.app-header { display:flex; align-items:center; gap:10px; padding:0 16px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
.panels { display:grid; grid-template-columns:370px 1fr 268px; height:100%; overflow:hidden; }
.panel { display:flex; flex-direction:column; background:var(--surface); border-right:1px solid var(--border); overflow:hidden; min-height:0; }
.panel:last-child { border-right:none; }
.panel-hd { display:flex; align-items:center; gap:7px; padding:9px 14px; border-bottom:1px solid var(--border); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); flex-shrink:0; }
.panel-body { flex:1; overflow-y:auto; padding:14px; min-height:0; }

/* Header */
.logo-title { font-size:15px; font-weight:700; color:var(--ink-1); line-height:1.1; }
.logo-sub   { font-size:10px; color:var(--ink-3); font-weight:500; letter-spacing:.04em; text-transform:uppercase; }
.status-pill { display:flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px; border:1px solid var(--border); background:var(--raised); font-size:11px; color:var(--ink-2); }
.status-dot { width:6px; height:6px; border-radius:50%; background:var(--ink-3); }
.status-dot.ok  { background:var(--success); animation:pulse-live 2.5s ease infinite; }
.status-dot.err { background:var(--danger); }

/* Placa selector */
.placa-trigger { display:flex; align-items:center; gap:6px; padding:5px 11px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--raised); color:var(--ink-1); font-size:12px; font-weight:600; font-family:var(--mono); letter-spacing:.08em; transition:all .15s; }
.placa-trigger:hover { border-color:var(--teal-border); color:var(--teal); }
.placa-trigger.sel { border-color:var(--teal-border); background:var(--teal-bg); color:var(--teal-text); }
.placa-dropdown { position:absolute; top:calc(100% + 6px); right:0; background:var(--surface); border:1px solid var(--border-plus); border-radius:var(--r-lg); box-shadow:var(--shadow-lg); z-index:200; min-width:210px; overflow:hidden; animation:slide-up .15s ease both; }
.placa-item { display:flex; align-items:center; justify-content:space-between; padding:9px 14px; cursor:pointer; font-size:12px; transition:background .1s; }
.placa-item:hover { background:var(--raised); }
.placa-item.act { background:var(--teal-bg); }
.pi-placa { font-family:var(--mono); font-weight:600; color:var(--teal-text); letter-spacing:.08em; }
.pi-meta  { font-size:10px; color:var(--ink-3); text-align:right; }
.placa-all { padding:7px 14px; border-top:1px solid var(--border); font-size:11px; color:var(--ink-3); cursor:pointer; text-align:center; transition:background .1s; }
.placa-all:hover { background:var(--raised); color:var(--ink-2); }

/* Chat */
.chat-msgs { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; min-height:0; }
.msg { display:flex; flex-direction:column; gap:4px; }
.msg-user { align-items:flex-end; }
.msg-guru  { align-items:flex-start; }
.bubble { max-width:88%; padding:10px 13px; border-radius:12px; font-size:13px; line-height:1.6; }
.bubble-user { background:var(--teal); color:#fff; border-bottom-right-radius:3px; }
.bubble-guru { background:var(--raised); color:var(--ink-1); border:1px solid var(--border); border-bottom-left-radius:3px; }
.bubble-err  { background:var(--danger-bg); border-color:rgba(220,38,38,.25); color:var(--danger); }
.msg-meta { display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--ink-3); padding:0 3px; flex-wrap:wrap; }
.itag { display:inline-flex; align-items:center; padding:2px 7px; border-radius:100px; font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.itag-normativa  { background:rgba(99,102,241,.12); color:#818CF8; }
.itag-financiera { background:rgba(13,127,110,.12); color:var(--teal-text); }
.itag-activos    { background:rgba(217,119,6,.12); color:var(--warn); }
.itag-mixta      { background:rgba(37,211,175,.12); color:var(--teal-mid); }
.warn-banner { display:flex; align-items:flex-start; gap:6px; padding:6px 10px; background:var(--warn-bg); border:1px solid rgba(217,119,6,.25); border-radius:var(--r-sm); font-size:11px; color:var(--warn); margin-top:4px; max-width:88%; }
.typing-dots { display:flex; align-items:center; gap:4px; padding:10px 14px; background:var(--raised); border:1px solid var(--border); border-radius:12px; border-bottom-left-radius:3px; width:fit-content; }

/* Input */
.chat-footer { padding:12px 14px; border-top:1px solid var(--border); background:var(--surface); flex-shrink:0; }
.chips { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:9px; }
.chip { padding:3px 9px; border-radius:100px; border:1px solid var(--border); background:var(--raised); color:var(--ink-2); font-size:11px; transition:all .15s; }
.chip:hover { border-color:var(--teal-border); color:var(--teal-text); background:var(--teal-bg); }
.input-row { display:flex; gap:7px; }
.chat-input { flex:1; padding:8px 12px; border:1px solid var(--border); border-radius:var(--r-md); background:var(--raised); color:var(--ink-1); font-size:13px; outline:none; transition:border-color .15s; font-family:var(--font); }
.chat-input:focus { border-color:var(--teal-border); background:var(--surface); }
.chat-input::placeholder { color:var(--ink-3); }
.send-btn { display:flex; align-items:center; gap:5px; padding:8px 14px; background:var(--teal); color:#fff; border:none; border-radius:var(--r-md); font-size:13px; font-weight:600; transition:background .15s; }
.send-btn:hover:not(:disabled) { background:var(--teal-mid); }
.send-btn:disabled { background:var(--ink-3); cursor:not-allowed; }

/* Tabs */
.tabs { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; }
.tab { padding:10px 16px; font-size:11px; font-weight:600; color:var(--ink-3); cursor:pointer; border-bottom:2px solid transparent; transition:all .15s; text-transform:uppercase; letter-spacing:.05em; }
.tab.act { color:var(--teal); border-bottom-color:var(--teal); }
.tab:hover:not(.act) { color:var(--ink-2); }

/* Panel tables */
.dtable { width:100%; border-collapse:collapse; font-size:11px; margin-top:8px; }
.dtable th { background:var(--raised); color:var(--ink-2); font-weight:600; text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:.04em; font-size:10px; white-space:nowrap; }
.dtable td { padding:6px 8px; border-bottom:1px solid var(--border); color:var(--ink-1); vertical-align:top; }
.dtable tr:last-child td { border-bottom:none; }
.dtable tr:hover td { background:var(--raised); }
.badge-nivel { display:inline-block; padding:2px 6px; border-radius:4px; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.badge-nivel.critica,.badge-nivel.vencido { background:#FEE2E2; color:#DC2626; }
.badge-nivel.alta,.badge-nivel.urgente   { background:#FFEDD5; color:#EA580C; }
.badge-nivel.media,.badge-nivel.proximo  { background:#FEF9C3; color:#CA8A04; }
.badge-nivel.baja                        { background:#DCFCE7; color:#16A34A; }
.badge-nivel.vigente                     { background:#DCFCE7; color:#16A34A; }
.t2sql-box { background:var(--raised); border:1px solid var(--border); border-radius:var(--r-md); padding:10px 12px; margin-bottom:10px; }
.t2sql-sql { font-family:var(--mono); font-size:9.5px; color:var(--ink-3); margin-top:4px; white-space:pre-wrap; word-break:break-all; }

/* Evidence */
.ev-card { background:var(--raised); border:1px solid var(--border); border-radius:var(--r-md); padding:12px; margin-bottom:10px; }
.ev-hd { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:6px; }
.ev-title { font-size:12px; font-weight:600; color:var(--ink-1); flex:1; }
.ev-pilar { font-size:9.5px; color:var(--ink-3); background:var(--surface); padding:2px 6px; border-radius:4px; border:1px solid var(--border); white-space:nowrap; font-family:var(--mono); flex-shrink:0; }
.ev-body  { font-size:12px; color:var(--ink-2); line-height:1.55; display:-webkit-box; -webkit-line-clamp:4; line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }

/* Metrics */
.metrics-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
.metric-card  { background:var(--raised); border:1px solid var(--border); border-radius:var(--r-md); padding:12px; }
.metric-lbl { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); margin-bottom:4px; font-weight:500; }
.metric-val { font-size:15px; font-weight:700; font-family:var(--mono); color:var(--ink-1); }
.mv-pos { color:var(--success); }
.mv-neg { color:var(--danger); }
.mv-acc { color:var(--teal-text); }

/* Alerts */
.alert-item { display:flex; align-items:flex-start; gap:8px; padding:8px 10px; border-radius:var(--r-sm); margin-bottom:6px; border:1px solid; }
.al-vencido,.al-critico { background:var(--danger-bg); border-color:rgba(220,38,38,.2); }
.al-urgente { background:rgba(249,115,22,.08); border-color:rgba(249,115,22,.2); }
.al-proximo { background:var(--warn-bg); border-color:rgba(217,119,6,.2); }
.al-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-top:5px; }
.dot-vencido,.dot-critico { background:var(--danger); }
.dot-urgente { background:#F97316; }
.dot-proximo { background:var(--warn); }
.al-placa { font-family:var(--mono); font-size:11px; font-weight:600; color:var(--teal-text); }
.al-tipo  { font-size:11px; color:var(--ink-2); }
.al-dias  { font-size:10px; color:var(--ink-3); margin-top:1px; }

/* KPI sidebar */
.kpi-block { padding:12px 14px; border-bottom:1px solid var(--border); }
.kpi-btitle { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); margin-bottom:8px; }
.kpi-row  { display:flex; justify-content:space-between; align-items:center; padding:4px 0; }
.kpi-name { font-size:12px; color:var(--ink-2); }
.kpi-val  { font-size:12px; font-weight:600; color:var(--ink-1); font-family:var(--mono); }

/* Vehicle card */
.veh-card { background:var(--teal-bg); border:1px solid var(--teal-border); border-radius:var(--r-md); padding:12px; margin-bottom:8px; }
.veh-placa { font-family:var(--mono); font-size:20px; font-weight:700; color:var(--teal-text); letter-spacing:.12em; margin-bottom:3px; }

/* Misc */
.sec-lbl { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); margin:12px 0 7px; }
.sec-lbl:first-child { margin-top:0; }
.sql-tag { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:var(--r-sm); background:var(--info-bg); border:1px solid rgba(37,99,235,.15); color:var(--info); font-size:10.5px; font-family:var(--mono); margin-bottom:5px; }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 16px; color:var(--ink-3); }
.empty-ico   { font-size:28px; margin-bottom:10px; opacity:.6; }
.empty-title { font-size:13px; font-weight:600; margin-bottom:4px; color:var(--ink-2); }
.empty-sub   { font-size:11px; max-width:200px; line-height:1.5; }

/* TweaksPanel */
.twk-panel{position:fixed;right:16px;bottom:16px;z-index:9999;width:220px;background:rgba(250,249,247,.9);color:#29261b;backdrop-filter:blur(16px);border:.5px solid rgba(255,255,255,.6);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);font:12px/1.4 ui-sans-serif,sans-serif;overflow:hidden;}
.twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 14px;}
.twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.5);width:22px;height:22px;border-radius:6px;font-size:13px;}
.twk-x:hover{background:rgba(0,0,0,.06);}
.twk-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;}
.twk-row-h{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;background:rgba(0,0,0,.15);transition:background .15s;padding:0;}
.twk-toggle[data-on="1"]{background:#34c759;}
.twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s;}
.twk-toggle[data-on="1"] i{transform:translateX(14px);}
.twk-fab{position:fixed;right:16px;bottom:16px;z-index:9999;width:34px;height:34px;border-radius:10px;border:.5px solid rgba(0,0,0,.12);background:rgba(250,249,247,.88);backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(41,38,27,.6);}
</style>
</head>

<div id="root"><p style="padding:24px;font-family:sans-serif;font-size:14px;color:#555">
  Cargando GuruMaster... (necesita internet para descargar React/Babel desde CDN)<br><br>
  Si este mensaje persiste, abre el archivo en <strong>Chrome o Edge</strong> — no en VS Code preview.
</p></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ══════════════════════════════════════════
   TWEAKS PANEL
══════════════════════════════════════════ */
function useTweaks(defaults) {
  const [values, setValues] = useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues(prev => ({ ...prev, [key]: val }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ tweaks, setTweak }) {
  const [open, setOpen] = useState(false);
  if (!open) return (
    <button className="twk-fab" onClick={() => setOpen(true)}>⚙</button>
  );
  return (
    <div className="twk-panel">
      <div className="twk-hd">
        <b style={{fontSize:11,fontWeight:600}}>Ajustes UI</b>
        <button className="twk-x" onClick={() => setOpen(false)}>✕</button>
      </div>
      <div className="twk-body">
        <div className="twk-row-h">
          <span style={{fontSize:11}}>Modo oscuro</span>
          <button className="twk-toggle" data-on={tweaks.darkMode ? '1' : '0'}
            onClick={() => setTweak('darkMode', !tweaks.darkMode)}>
            <i />
          </button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   ICON (Lucide)
══════════════════════════════════════════ */
function Icon({ name, size = 15, color }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !window.lucide) return;
    const key = name.replace(/-([a-z0-9])/g, (_, c) => c.toUpperCase()).replace(/^./, c => c.toUpperCase());
    if (!lucide[key]) return;
    ref.current.innerHTML = '';
    const el = lucide.createElement(lucide[key]);
    el.setAttribute('width', size);
    el.setAttribute('height', size);
    if (color) el.setAttribute('stroke', color);
    ref.current.appendChild(el);
  }, [name, size, color]);
  return <span ref={ref} style={{display:'inline-flex',alignItems:'center',flexShrink:0}} />;
}

/* ══════════════════════════════════════════
   GURUTEXT  — markdown-lite
══════════════════════════════════════════ */
function GuruText({ text }) {
  const lines = (text || '').split('\n');
  const bold = line =>
    line.split(/(\*\*[^*]+\*\*)/g).map((p, i) =>
      p.startsWith('**') ? <strong key={i} style={{color:'var(--ink-1)',fontWeight:600}}>{p.slice(2,-2)}</strong> : p
    );
  return (
    <div style={{display:'flex',flexDirection:'column',gap:5}}>
      {lines.map((line, i) => {
        if (!line.trim()) return <div key={i} style={{height:3}} />;
        if (line.startsWith('- ')) return (
          <div key={i} style={{display:'flex',gap:9,paddingLeft:4}}>
            <span style={{color:'var(--teal)',lineHeight:1,marginTop:4,flexShrink:0}}>–</span>
            <span style={{fontSize:12,color:'var(--ink-2)',lineHeight:1.6}}>{bold(line.slice(2))}</span>
          </div>
        );
        if (/^\d+\. /.test(line)) return (
          <div key={i} style={{display:'flex',gap:9,paddingLeft:4}}>
            <span style={{fontSize:12,color:'var(--teal)',fontWeight:600,minWidth:16,flexShrink:0}}>{line.match(/^\d+/)[0]}.</span>
            <span style={{fontSize:12,color:'var(--ink-2)',lineHeight:1.6}}>{bold(line.replace(/^\d+\.\s*/,''))}</span>
          </div>
        );
        return <p key={i} style={{fontSize:13,color:'var(--ink-2)',lineHeight:1.65}}>{bold(line)}</p>;
      })}
    </div>
  );
}

/* ══════════════════════════════════════════
   LOGO
══════════════════════════════════════════ */
function LogoMark({ size = 28 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 32 32" fill="none">
      <path d="M16 2L28 8.5V23.5L16 30L4 23.5V8.5Z" fill="var(--teal)" />
      <path d="M8 20L12 10L16 17L20 13L24 20" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx="16" cy="10" r="1.5" fill="white" opacity=".7"/>
    </svg>
  );
}

/* ══════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════ */
const API = 'http://localhost:8000';

const VEHICLES = [
  { id:'V001', placa:'ABC123', tipo:'Tractocamion',    marca:'Kenworth' },
  { id:'V002', placa:'DEF456', tipo:'Camion sencillo', marca:'Hino' },
  { id:'V003', placa:'GHI789', tipo:'Doble troque',    marca:'Chevrolet' },
  { id:'V004', placa:'JKL321', tipo:'Turbo',           marca:'NPR' },
  { id:'V005', placa:'MNO654', tipo:'Tractocamion',    marca:'Freightliner' },
];

const SUGGESTIONS = [
  '¿El viaje de ABC123 en mayo fue rentable?',
  '¿Qué documentos necesito para un despacho?',
  '¿Cuánto gasté en combustible este mes?',
  '¿Qué vehículos tienen documentos por vencer?',
  '¿Es obligatorio el SICE-TAC para fijar el flete?',
  '¿Cuál es el margen de la flota en mayo?',
];

const DEFAULT_MSG = {
  id: 0, role: 'guru',
  text: 'Hola, soy **GuruMaster Carga**.\n\nPuedo ayudarte a consultar normatividad de transporte, analizar rentabilidad de viajes, revisar costos operativos y controlar vencimientos de tu flota.\n\n¿Qué quieres consultar hoy?',
  intent: null, confianza: null, fuentes: [], metricas: null, advertencias: [],
};

function fmtCOP(val) {
  if (val == null) return '$0';
  return Number(val).toLocaleString('es-CO', { style:'currency', currency:'COP', minimumFractionDigits:0, maximumFractionDigits:0 });
}

function findVehicle(placa) {
  const n = (placa || '').toUpperCase().replace('-', '');
  return VEHICLES.find(v => v.placa.replace('-','') === n) || null;
}

/* ══════════════════════════════════════════
   APP
══════════════════════════════════════════ */
function App() {
  const [tweaks, setTweak]       = useTweaks({ darkMode: false });
  const [msgs, setMsgs]          = useState([DEFAULT_MSG]);
  const [input, setInput]        = useState('');
  const [loading, setLoading]    = useState(false);
  const [selVeh, setSelVeh]      = useState(null);
  const [menuOpen, setMenuOpen]  = useState(false);
  const [activeTab, setActiveTab]= useState('evidencia');
  const [alerts, setAlerts]      = useState([]);
  const [online, setOnline]      = useState(null);
  const [lastResp, setLastResp]  = useState(null);

  const endRef   = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', tweaks.darkMode ? 'dark' : 'light');
  }, [tweaks.darkMode]);

  useEffect(() => {
    fetch(API + '/health').then(r => setOnline(r.ok)).catch(() => setOnline(false));
    fetch(API + '/api/vehicles/alerts?days=30').then(r => r.ok ? r.json() : []).then(d => setAlerts(d)).catch(() => {});
  }, []);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [msgs, loading]);

  async function send(text) {
    const q = (text ?? input).trim();
    if (!q || loading) return;
    setInput('');

    const m = q.toUpperCase().match(/\b([A-Z]{3}-?[0-9]{3})\b/);
    if (m) { const v = findVehicle(m[1]); if (v) setSelVeh(v); }

    setMsgs(prev => [...prev, { id: Date.now(), role:'user', text: q }]);
    setLoading(true);

    try {
      const res = await fetch(API + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pregunta: q, filtros: selVeh ? { vehiculo_id: selVeh.id } : {} }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      setLastResp(data);
      setOnline(true);
      const i = data.intencion;
      setActiveTab(i === 'financiera' || (i === 'mixta' && data.metricas) ? 'financiero' : i === 'activos' ? 'activos' : 'evidencia');
      setMsgs(prev => [...prev, { id: Date.now()+1, role:'guru', text: data.respuesta, intent: data.intencion, confianza: data.confianza, fuentes: data.fuentes||[], metricas: data.metricas||null, advertencias: data.advertencias||[] }]);
    } catch(err) {
      setMsgs(prev => [...prev, { id: Date.now()+1, role:'guru', isErr: true, text: 'No pude conectar con el backend.\n\nVerifica que el servidor corra con: **uvicorn main:app --reload** en la carpeta /backend.', intent:null, confianza:null, fuentes:[], metricas:null, advertencias:[] }]);
    } finally {
      setLoading(false);
    }
  }

  const docFuentes = (lastResp?.fuentes||[]).filter(f => f.tipo === 'documento');
  const metricas   = lastResp?.metricas || null;

  return (
    <div className="app-shell">

      {/* HEADER */}
      <header className="app-header">
        <div style={{display:'flex',alignItems:'center',gap:9}}>
          <LogoMark size={28}/>
          <div>
            <div className="logo-title">GuruMaster</div>
            <div className="logo-sub">Carga Colombia</div>
          </div>
        </div>

        <div style={{width:1,height:24,background:'var(--border)',margin:'0 4px'}} />

        <div className="status-pill">
          <div className={`status-dot ${online===true?'ok':online===false?'err':''}`}/>
          <span>{online===null?'Conectando…':online?'API Online':'API Offline'}</span>
        </div>

        <div style={{flex:1}}/>

        <span style={{fontSize:10,color:'var(--ink-3)',textTransform:'uppercase',letterSpacing:'.06em',marginRight:4}}>Vehículo</span>
        <div style={{position:'relative'}}>
          <button
            className={`placa-trigger ${selVeh?'sel':''}`}
            onClick={() => setMenuOpen(o => !o)}
          >
            {selVeh ? selVeh.placa : 'Todos'}
            <Icon name="chevron-down" size={12}/>
          </button>
          {menuOpen && (
            <div className="placa-dropdown">
              {VEHICLES.map(v => (
                <div key={v.id} className={`placa-item ${selVeh?.id===v.id?'act':''}`}
                  onClick={() => { setSelVeh(v); setMenuOpen(false); }}>
                  <span className="pi-placa">{v.placa}</span>
                  <div className="pi-meta"><div>{v.tipo}</div><div>{v.marca}</div></div>
                </div>
              ))}
              <div className="placa-all" onClick={() => { setSelVeh(null); setMenuOpen(false); }}>
                Ver todos los vehículos
              </div>
            </div>
          )}
        </div>

        <button onClick={() => setTweak('darkMode', !tweaks.darkMode)}
          style={{padding:'5px 8px',border:'1px solid var(--border)',borderRadius:'var(--r-sm)',background:'var(--raised)',color:'var(--ink-2)',marginLeft:6,display:'flex',alignItems:'center'}}>
          <Icon name={tweaks.darkMode?'sun':'moon'} size={14}/>
        </button>
      </header>

      {/* PANELS */}
      <div className="panels">

        {/* ── CHAT ── */}
        <div className="panel">
          <div className="panel-hd"><Icon name="message-circle" size={12}/>Chat GuruMaster</div>

          <div className="chat-msgs">
            {msgs.map(m => (
              <div key={m.id} className={`msg msg-${m.role} anim-up`}>
                {m.role === 'user'
                  ? <div className="bubble bubble-user">{m.text}</div>
                  : <>
                      <div className={`bubble bubble-guru ${m.isErr?'bubble-err':''}`}>
                        <GuruText text={m.text}/>
                      </div>
                      {(m.intent || m.confianza != null) && (
                        <div className="msg-meta">
                          {m.intent && <span className={`itag itag-${m.intent}`}>{m.intent}</span>}
                          {m.confianza != null && <span>{Math.round(m.confianza*100)}% conf.</span>}
                          {m.fuentes?.length > 0 && <span>{m.fuentes.length} fuente{m.fuentes.length!==1?'s':''}</span>}
                        </div>
                      )}
                      {(m.advertencias||[]).map((w,i) => (
                        <div key={i} className="warn-banner"><Icon name="alert-triangle" size={12}/><span>{w}</span></div>
                      ))}
                    </>
                }
              </div>
            ))}
            {loading && (
              <div className="msg msg-guru">
                <div className="typing-dots"><div className="dot"/><div className="dot"/><div className="dot"/></div>
              </div>
            )}
            <div ref={endRef}/>
          </div>

          <div className="chat-footer">
            <div className="chips">
              {SUGGESTIONS.slice(0,3).map((s,i) => (
                <button key={i} className="chip" onClick={() => send(s)}>
                  {s.length>44 ? s.slice(0,44)+'…' : s}
                </button>
              ))}
            </div>
            <div className="input-row">
              <input ref={inputRef} className="chat-input" value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }}
                placeholder="Escribe tu pregunta sobre la flota…" disabled={loading}/>
              <button className="send-btn" onClick={() => send()} disabled={loading||!input.trim()}>
                <Icon name="send" size={13}/>Enviar
              </button>
            </div>
          </div>
        </div>

        {/* ── CENTRO: EVIDENCIA / FINANCIERO / ACTIVOS ── */}
        <div className="panel">
          <div className="tabs">
            {[['evidencia','Evidencia','file-search'],['financiero','Financiero','trending-up'],['activos','Activos','truck']].map(([k,l]) => (
              <div key={k} className={`tab ${activeTab===k?'act':''}`} onClick={() => setActiveTab(k)}>{l}</div>
            ))}
          </div>

          <div className="panel-body">

            {activeTab === 'evidencia' && (
              docFuentes.length === 0
                ? <div className="empty-state"><div className="empty-ico">📄</div><div className="empty-title">Sin evidencia documental</div><div className="empty-sub">Pregunta sobre normatividad, SICE-TAC o RNDC para ver fuentes aquí.</div></div>
                : <>
                    <div className="sec-lbl">Fuentes documentales ({docFuentes.length})</div>
                    {docFuentes.map((f,i) => (
                      <div key={i} className="ev-card anim-up">
                        <div className="ev-hd">
                          <div className="ev-title">{f.nombre}</div>
                          {f.pilar && <span className="ev-pilar">{f.pilar.replace(/_/g,' ')}</span>}
                        </div>
                        {f.contenido && <div className="ev-body">{f.contenido}</div>}
                      </div>
                    ))}
                  </>
            )}

            {activeTab === 'financiero' && (() => {
              const dp = lastResp?.datos_panel;
              const viajes = dp?.viajes || [];
              const rent = dp?.rentabilidad;
              const t2sql = dp?.query_dinamico;
              return !metricas && !viajes.length && !t2sql
                ? <div className="empty-state"><div className="empty-ico">💰</div><div className="empty-title">Sin datos financieros</div><div className="empty-sub">Pregunta por rentabilidad de un viaje o costos del mes.</div></div>
                : <>
                    {metricas && <>
                      <div className="sec-lbl">Resumen financiero</div>
                      <div className="metrics-grid">
                        <div className="metric-card"><div className="metric-lbl">Ingresos</div><div className="metric-val mv-acc">{fmtCOP(metricas.ingreso)}</div></div>
                        <div className="metric-card"><div className="metric-lbl">Gastos</div><div className="metric-val mv-neg">{fmtCOP(metricas.gastos)}</div></div>
                        <div className="metric-card"><div className="metric-lbl">Utilidad</div><div className={`metric-val ${metricas.utilidad>=0?'mv-pos':'mv-neg'}`}>{fmtCOP(metricas.utilidad)}</div></div>
                        <div className="metric-card"><div className="metric-lbl">Margen</div><div className={`metric-val ${metricas.margen_pct>=0?'mv-pos':'mv-neg'}`}>{metricas.margen_pct}%</div></div>
                      </div>
                    </>}
                    {t2sql?.filas?.length > 0 && <>
                      <div className="sec-lbl" style={{marginTop:12}}>Resultado de consulta</div>
                      <div className="t2sql-box">
                        <div className="t2sql-sql">{t2sql.sql}</div>
                        <table className="dtable" style={{marginTop:8}}>
                          <thead><tr>{Object.keys(t2sql.filas[0]).map(k=><th key={k}>{k}</th>)}</tr></thead>
                          <tbody>{t2sql.filas.map((row,i)=><tr key={i}>{Object.values(row).map((v,j)=><td key={j}>{typeof v==='number'&&v>10000?fmtCOP(v):String(v??'—')}</td>)}</tr>)}</tbody>
                        </table>
                      </div>
                    </>}
                    {viajes.length > 0 && <>
                      <div className="sec-lbl" style={{marginTop:12}}>Viajes ({viajes.length})</div>
                      <table className="dtable">
                        <thead><tr><th>Fecha</th><th>Vehículo</th><th>Ruta</th><th>Ingreso</th><th>Estado</th></tr></thead>
                        <tbody>{viajes.map((v,i)=>(
                          <tr key={i}>
                            <td>{v.fecha_viaje}</td>
                            <td style={{fontFamily:'var(--mono)',fontWeight:600}}>{v.vehiculo_id}</td>
                            <td>{v.ciudad_origen&&v.ciudad_destino?`${v.ciudad_origen}→${v.ciudad_destino}`:v.ruta_id||'—'}</td>
                            <td style={{color:'var(--teal-text)',fontWeight:600}}>{fmtCOP(v.ingreso)}</td>
                            <td><span className={`badge-nivel ${v.estado_viaje==='Completado'?'vigente':'media'}`}>{v.estado_viaje}</span></td>
                          </tr>
                        ))}</tbody>
                      </table>
                    </>}
                  </>;
            })()}

            {activeTab === 'activos' && (() => {
              const dp = lastResp?.datos_panel;
              const mants = dp?.mantenimientos || [];
              const docs  = dp?.documentos    || [];
              const docVencer = dp?.documentos_por_vencer || [];
              const alertas = dp?.alertas     || [];
              const flota   = dp?.flota       || [];
              const hasPanelData = dp?.tipo === 'activos';

              return <>
                {hasPanelData && mants.length > 0 && <>
                  <div className="sec-lbl">Historial de mantenimiento ({mants.length})</div>
                  <table className="dtable">
                    <thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Valor</th><th>Proveedor</th></tr></thead>
                    <tbody>{mants.map((m,i)=>(
                      <tr key={i}>
                        <td style={{whiteSpace:'nowrap'}}>{m.fecha_mantenimiento}</td>
                        <td><span className={`badge-nivel ${m.tipo_mantenimiento==='Preventivo'?'vigente':'alta'}`}>{m.tipo_mantenimiento}</span></td>
                        <td>{m.categoria_mantenimiento}</td>
                        <td style={{color:'var(--ink-2)',fontWeight:600}}>{fmtCOP(m.valor)}</td>
                        <td style={{color:'var(--ink-3)'}}>{m.proveedor||'—'}</td>
                      </tr>
                    ))}</tbody>
                  </table>
                </>}

                {hasPanelData && docs.length > 0 && <>
                  <div className="sec-lbl" style={{marginTop:12}}>Documentos del vehículo ({docs.length})</div>
                  <table className="dtable">
                    <thead><tr><th>Documento</th><th>Estado</th><th>Vencimiento</th><th>Días</th></tr></thead>
                    <tbody>{docs.map((d,i)=>{
                      const dias = d.dias_restantes;
                      const urg = dias==null?'baja':dias<0?'vencido':dias<=7?'critica':dias<=15?'urgente':dias<=30?'proximo':'vigente';
                      return <tr key={i}>
                        <td>{d.tipo_documento}</td>
                        <td><span className={`badge-nivel ${urg}`}>{d.estado}</span></td>
                        <td style={{whiteSpace:'nowrap'}}>{d.fecha_vencimiento||'—'}</td>
                        <td style={{color:dias<0?'var(--danger)':dias<=30?'var(--warn)':'var(--ink-2)',fontWeight:600}}>
                          {dias==null?'—':dias<0?`Vencido ${Math.abs(dias)}d`:`${dias}d`}
                        </td>
                      </tr>;
                    })}</tbody>
                  </table>
                </>}

                {hasPanelData && docVencer.length > 0 && <>
                  <div className="sec-lbl" style={{marginTop:12}}>Documentos por vencer — flota ({docVencer.length})</div>
                  <table className="dtable">
                    <thead><tr><th>Placa</th><th>Documento</th><th>Urgencia</th><th>Vencimiento</th></tr></thead>
                    <tbody>{docVencer.map((d,i)=>(
                      <tr key={i}>
                        <td style={{fontFamily:'var(--mono)',fontWeight:600}}>{d.placa}</td>
                        <td>{d.tipo_documento}</td>
                        <td><span className={`badge-nivel ${d.urgencia}`}>{d.urgencia}</span></td>
                        <td style={{whiteSpace:'nowrap',color:d.dias_restantes<0?'var(--danger)':'var(--ink-2)'}}>
                          {d.dias_restantes<0?`Vencido hace ${Math.abs(d.dias_restantes)}d`:`${d.dias_restantes}d (${d.fecha_vencimiento})`}
                        </td>
                      </tr>
                    ))}</tbody>
                  </table>
                </>}

                {!hasPanelData && <>
                  <div className="sec-lbl">Alertas próximos 30 días ({alerts.length})</div>
                  {alerts.length === 0
                    ? <div style={{fontSize:12,color:'var(--ink-3)'}}>Sin alertas activas.</div>
                    : alerts.slice(0,20).map((a,i) => (
                        <div key={i} className={`alert-item al-${a.urgencia}`}>
                          <div className={`al-dot dot-${a.urgencia}`}/>
                          <div>
                            <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:2}}>
                              <span className="al-placa">{a.placa}</span>
                              <span style={{fontSize:9.5,textTransform:'uppercase',color:'var(--ink-3)',letterSpacing:'.04em'}}>{a.urgencia}</span>
                            </div>
                            <div className="al-tipo">{a.tipo_documento}</div>
                            <div className="al-dias">{a.dias_restantes<0?`Vencido hace ${Math.abs(a.dias_restantes)} dias`:`Vence en ${a.dias_restantes} dias (${a.fecha_vencimiento})`}</div>
                          </div>
                        </div>
                      ))
                  }
                </>}
              </>;
            })()}

          </div>
        </div>

        {/* ── DERECHO: DASHBOARD ── */}
        <div className="panel">
          <div className="panel-hd"><Icon name="bar-chart-2" size={12}/>Dashboard</div>
          <div style={{overflowY:'auto',flex:1,minHeight:0}}>

            <div className="kpi-block">
              <div className="kpi-btitle">Ultima consulta</div>
              {metricas ? (
                <>
                  <div className="kpi-row"><span className="kpi-name">Ingresos</span><span className="kpi-val" style={{color:'var(--teal-text)'}}>{fmtCOP(metricas.ingreso)}</span></div>
                  <div className="kpi-row"><span className="kpi-name">Gastos</span><span className="kpi-val" style={{color:'var(--danger)'}}>{fmtCOP(metricas.gastos)}</span></div>
                  <div className="kpi-row"><span className="kpi-name">Utilidad</span><span className="kpi-val" style={{color:metricas.utilidad>=0?'var(--success)':'var(--danger)'}}>{fmtCOP(metricas.utilidad)}</span></div>
                  <div className="kpi-row"><span className="kpi-name">Margen</span><span className="kpi-val" style={{color:metricas.margen_pct>=0?'var(--success)':'var(--danger)'}}>{metricas.margen_pct}%</span></div>
                </>
              ) : <div style={{fontSize:12,color:'var(--ink-3)'}}>Consulta rentabilidad para ver KPIs.</div>}
            </div>

            {selVeh && (
              <div className="kpi-block">
                <div className="kpi-btitle">Vehiculo activo</div>
                <div style={{fontFamily:'var(--mono)',fontSize:16,fontWeight:700,color:'var(--teal-text)',letterSpacing:'.1em',marginBottom:3}}>{selVeh.placa}</div>
                <div style={{fontSize:11,color:'var(--ink-2)'}}>{selVeh.tipo} · {selVeh.marca}</div>
              </div>
            )}

            <div className="kpi-block">
              <div className="kpi-btitle">Resumen alertas</div>
              {[['vencido','Vencidos','var(--danger)'],['critico','Criticos','var(--danger)'],['urgente','Urgentes','#F97316'],['proximo','Proximos','var(--warn)']].map(([k,l,c]) => {
                const cnt = alerts.filter(a => a.urgencia===k).length;
                return cnt ? <div key={k} className="kpi-row"><span className="kpi-name">{l}</span><span className="kpi-val" style={{color:c}}>{cnt}</span></div> : null;
              })}
              {alerts.length===0 && <div style={{fontSize:12,color:'var(--ink-3)'}}>Sin alertas activas.</div>}
            </div>

            <div className="kpi-block">
              <div className="kpi-btitle">Preguntas frecuentes</div>
              {SUGGESTIONS.slice(3).map((s,i) => (
                <div key={i} onClick={() => { send(s); inputRef.current?.focus(); }}
                  style={{fontSize:11,color:'var(--ink-2)',padding:'5px 0',cursor:'pointer',borderBottom:'1px solid var(--border)',lineHeight:1.4,transition:'color .15s'}}
                  onMouseEnter={e => e.currentTarget.style.color='var(--teal)'}
                  onMouseLeave={e => e.currentTarget.style.color='var(--ink-2)'}>{s}</div>
              ))}
            </div>

            <div className="kpi-block">
              <div className="kpi-btitle">Flota</div>
              {VEHICLES.map(v => (
                <div key={v.id} className="kpi-row" style={{cursor:'pointer'}} onClick={() => setSelVeh(v)}>
                  <span style={{fontFamily:'var(--mono)',fontSize:11,fontWeight:600,color:selVeh?.id===v.id?'var(--teal)':'var(--ink-2)'}}>{v.placa}</span>
                  <span style={{fontSize:10,color:'var(--ink-3)'}}>{v.marca}</span>
                </div>
              ))}
            </div>

          </div>
        </div>

      </div>

      {menuOpen && <div style={{position:'fixed',inset:0,zIndex:100}} onClick={() => setMenuOpen(false)}/>}
      <TweaksPanel tweaks={tweaks} setTweak={setTweak}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
